apiVersion: apps/v1
kind: Deployment
metadata:
  name: moyuan-sar-discovery-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moyuan-sar-discovery-v2
  template:
    metadata:
      labels:
        app: moyuan-sar-discovery-v2
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: discovery
          image: registry.example.com/moyuan-sar-discovery-v2:2.0.0
          env:
            - name: SHOPREC_HOST
              value: "0.0.0.0"
            - name: SHOPREC_PORT
              value: "18083"
            - name: MOYUAN_AGENT_MODEL_MODE
              value: replay
          ports:
            - name: http
              containerPort: 18083
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: moyuan-sar-discovery-v2
spec:
  selector:
    app: moyuan-sar-discovery-v2
  ports:
    - name: http
      port: 18083
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: moyuan-sar-runtime-v2
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moyuan-sar-control-plane-v2
spec:
  # SQLite is intentionally single-writer. Move runs/events to Postgres before scaling this deployment.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: moyuan-sar-control-plane-v2
  template:
    metadata:
      labels:
        app: moyuan-sar-control-plane-v2
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: control-plane
          image: registry.example.com/moyuan-sar-control-plane-v2:2.0.0
          env:
            - name: MOYUAN_CONTROL_HOST
              value: "0.0.0.0"
            - name: MOYUAN_CONTROL_PORT
              value: "19090"
            - name: MOYUAN_DATABASE_PATH
              value: /app/code/.runtime/commerce-agent.sqlite
            - name: MOYUAN_DISCOVERY_MODE
              value: python
            - name: MOYUAN_DISCOVERY_BASE_URL
              value: http://moyuan-sar-discovery-v2:18083
            - name: MOYUAN_AGENT_MODEL_MODE
              value: replay
            - name: MOYUAN_SECURE_COOKIE
              value: "true"
            - name: MOYUAN_ENABLE_V1_API
              value: "false"
          ports:
            - name: http
              containerPort: 19090
          volumeMounts:
            - name: runtime
              mountPath: /app/code/.runtime
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: moyuan-sar-runtime-v2
---
apiVersion: v1
kind: Service
metadata:
  name: moyuan-sar-control-plane-v2
spec:
  selector:
    app: moyuan-sar-control-plane-v2
  ports:
    - name: http
      port: 80
      targetPort: http
