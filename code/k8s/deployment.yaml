apiVersion: apps/v1
kind: Deployment
metadata:
  name: moyuan-sar-agent-legacy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moyuan-sar-agent-legacy
  template:
    metadata:
      labels:
        app: moyuan-sar-agent-legacy
    spec:
      containers:
        - name: api
          image: registry.example.com/moyuan-sar-agent-legacy:0.3.0
          command: ["python", "-m", "shoprec.server"]
          env:
            - name: SHOPREC_HOST
              value: "0.0.0.0"
            - name: SHOPREC_PORT
              value: "8080"
            - name: SHOPREC_EXPERIMENT_CONFIG
              value: "/app/config/experiments.json"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: moyuan-sar-agent-legacy
spec:
  selector:
    app: moyuan-sar-agent-legacy
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: moyuan-sar-agent-legacy
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: moyuan-sar-agent-legacy
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: moyuan-sar-agent-legacy
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: moyuan-sar-agent-legacy
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
