server:
  port: ${BUYSENSE_PORT:19090}
  shutdown: graceful

spring:
  application:
    name: buysense-java
  datasource:
    url: ${BUYSENSE_DB_URL:jdbc:h2:file:./data/buysense;MODE=PostgreSQL;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE}
    username: ${BUYSENSE_DB_USERNAME:sa}
    password: ${BUYSENSE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 8
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

buysense:
  session-secret: ${BUYSENSE_SESSION_SECRET:local-development-secret-change-me}
  runs:
    max-concurrent: ${BUYSENSE_RUN_MAX_CONCURRENT:16}
    queue-capacity: ${BUYSENSE_RUN_QUEUE_CAPACITY:256}
    max-active-per-identity: ${BUYSENSE_RUN_MAX_ACTIVE_PER_IDENTITY:3}
    max-created-per-minute: ${BUYSENSE_RUN_MAX_CREATED_PER_MINUTE:30}
    lease-duration: ${BUYSENSE_RUN_LEASE_DURATION:2m}
    lease-renewal-delay: ${BUYSENSE_RUN_LEASE_RENEWAL_DELAY:30s}
    recovery-initial-delay: ${BUYSENSE_RUN_RECOVERY_INITIAL_DELAY:5s}
    recovery-delay: ${BUYSENSE_RUN_RECOVERY_DELAY:30s}
    cleanup-delay: ${BUYSENSE_RUN_CLEANUP_DELAY:1h}
    proposal-ttl: ${BUYSENSE_PROPOSAL_TTL:15m}
    terminal-retention: ${BUYSENSE_RUN_RETENTION:30d}
  modelport:
    enabled: ${BUYSENSE_MODELPORT_ENABLED:false}
    base-url: ${BUYSENSE_MODELPORT_URL:http://127.0.0.1:38082}
    api-key: ${BUYSENSE_MODELPORT_KEY:dev-client-key}
    model: ${BUYSENSE_MODELPORT_MODEL:qwen-default}
    role-models:
      intent_router: ${BUYSENSE_MODELPORT_MODEL_INTENT_ROUTER:${BUYSENSE_MODELPORT_MODEL:qwen-default}}
      search: ${BUYSENSE_MODELPORT_MODEL_SEARCH:${BUYSENSE_MODELPORT_MODEL:qwen-default}}
      recommendation: ${BUYSENSE_MODELPORT_MODEL_RECOMMENDATION:${BUYSENSE_MODELPORT_MODEL:qwen-default}}
      ads: ${BUYSENSE_MODELPORT_MODEL_ADS:${BUYSENSE_MODELPORT_MODEL:qwen-default}}
      critic: ${BUYSENSE_MODELPORT_MODEL_CRITIC:${BUYSENSE_MODELPORT_MODEL:qwen-default}}
      lead: ${BUYSENSE_MODELPORT_MODEL_LEAD:${BUYSENSE_MODELPORT_MODEL:qwen-default}}
    connect-timeout: 1s
    read-timeout: 45s
    max-calls-per-run: ${BUYSENSE_MODELPORT_MAX_CALLS_PER_RUN:12}
    max-tokens-per-call: 768
    thinking-mode: ${BUYSENSE_MODELPORT_THINKING_MODE:disabled}
    disabled-roles: ${BUYSENSE_MODELPORT_DISABLED_ROLES:}
  domain:
    default-bundle:
      - phone
      - headphones
      - charger
  retail-provider:
    enabled: ${BUYSENSE_RETAIL_PROVIDER_ENABLED:false}
    base-url: ${BUYSENSE_RETAIL_PROVIDER_URL:}
    api-key: ${BUYSENSE_RETAIL_PROVIDER_KEY:}
    fallback-enabled: ${BUYSENSE_RETAIL_FALLBACK_ENABLED:false}
    allow-insecure-http: ${BUYSENSE_RETAIL_ALLOW_INSECURE_HTTP:false}
    connect-timeout: 1s
    read-timeout: 2s
    max-response-bytes: 1048576
  review-provider:
    enabled: ${BUYSENSE_REVIEW_PROVIDER_ENABLED:false}
    base-url: ${BUYSENSE_REVIEW_PROVIDER_URL:}
    query-path: ${BUYSENSE_REVIEW_PROVIDER_QUERY_PATH:/v1/reviews/query}
    api-key: ${BUYSENSE_REVIEW_PROVIDER_KEY:}
    fallback-enabled: ${BUYSENSE_REVIEW_FALLBACK_ENABLED:false}
    allow-insecure-http: ${BUYSENSE_REVIEW_ALLOW_INSECURE_HTTP:false}
    connect-timeout: 1s
    read-timeout: 3s
    max-response-bytes: 1048576
  shopify:
    enabled: ${BUYSENSE_SHOPIFY_ENABLED:false}
    store-domain: ${BUYSENSE_SHOPIFY_STORE_DOMAIN:}
    admin-access-token: ${BUYSENSE_SHOPIFY_ADMIN_ACCESS_TOKEN:}
    api-version: ${BUYSENSE_SHOPIFY_API_VERSION:2026-07}
    fallback-enabled: ${BUYSENSE_SHOPIFY_FALLBACK_ENABLED:false}
    connect-timeout: 1s
    read-timeout: 2s
    max-response-bytes: 1048576
    catalog-cache-ttl: ${BUYSENSE_SHOPIFY_CATALOG_CACHE_TTL:5m}
