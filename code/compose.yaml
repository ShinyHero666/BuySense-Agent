name: buysense

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BUYSENSE_PORT: 19090
      BUYSENSE_DB_URL: jdbc:h2:file:/app/data/buysense;MODE=PostgreSQL;AUTO_SERVER=TRUE;DATABASE_TO_LOWER=TRUE
      BUYSENSE_SESSION_SECRET: ${BUYSENSE_SESSION_SECRET:-local-development-secret-change-me}
      BUYSENSE_MODELPORT_ENABLED: ${BUYSENSE_MODELPORT_ENABLED:-false}
      BUYSENSE_MODELPORT_URL: ${BUYSENSE_MODELPORT_URL:-https://api.deepseek.com}
      BUYSENSE_MODELPORT_KEY: ${BUYSENSE_MODELPORT_KEY:-}
      BUYSENSE_MODELPORT_MODEL: ${BUYSENSE_MODELPORT_MODEL:-deepseek-chat}
      BUYSENSE_SHOPIFY_ENABLED: ${BUYSENSE_SHOPIFY_ENABLED:-false}
      BUYSENSE_SHOPIFY_STORE_DOMAIN: ${BUYSENSE_SHOPIFY_STORE_DOMAIN:-}
      BUYSENSE_SHOPIFY_ADMIN_ACCESS_TOKEN: ${BUYSENSE_SHOPIFY_ADMIN_ACCESS_TOKEN:-}
    ports:
      - "19090:19090"
    volumes:
      - buysense-data:/app/data

volumes:
  buysense-data:
