services:
  shoprec:
    build: .
    environment:
      SHOPREC_HOST: 0.0.0.0
      SHOPREC_PORT: 8080
      SHOPREC_EXPERIMENT_CONFIG: /app/config/experiments.json
      MOYUAN_AGENT_MODEL_MODE: ${MOYUAN_AGENT_MODEL_MODE:-replay}
      MOYUAN_MODELPORT_BASE_URL: ${MOYUAN_MODELPORT_BASE_URL:-http://host.docker.internal:38082}
      MOYUAN_MODELPORT_API_KEY: ${MOYUAN_MODELPORT_API_KEY:-}
      MOYUAN_MODELPORT_MODEL: ${MOYUAN_MODELPORT_MODEL:-moyuan-shoprec-agent}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=1)"
      interval: 10s
      timeout: 2s
      retries: 3
